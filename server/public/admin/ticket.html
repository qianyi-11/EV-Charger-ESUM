<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Ticket Detail — EV Charger Admin</title>

  <link rel="stylesheet" href="/admin/styles.css" />

</head>

<body class="ticket-detail-page">

  <div id="login-screen" class="login-screen hidden">

    <div class="login-card">

      <div class="login-logo">⚡</div>

      <h1>EV Charger Admin</h1>

      <p class="muted">Sign in to view ticket</p>

      <label>Email</label>

      <input id="login-email" type="email" value="admin@gmail.com" />

      <label>Password</label>

      <input id="login-password" type="password" value="Law.1234" />

      <button id="login-btn" class="btn primary">Sign In</button>

      <p id="login-error" class="error"></p>

    </div>

  </div>



  <div id="app" class="app hidden">

    <header class="topbar">

      <div class="brand">

        <a href="/admin" class="back-link" aria-label="Back" title="Back">←</a>

        <span id="page-title">Ticket</span>

      </div>

      <button id="logout-btn" class="btn ghost">Logout</button>

    </header>



    <main class="detail-layout">

      <section class="detail-left">

        <div class="panel">

          <h2>Update ticket</h2>

          <label>Assign engineer</label>

          <select id="assign-engineer"></select>

          <label>Status</label>

          <select id="ticket-status">

            <option value="open">Open</option>

            <option value="in_progress">In progress</option>

            <option value="complete">Complete</option>

          </select>

          <button id="save-btn" class="btn primary">Save changes</button>

          <p id="save-msg" class="success hidden"></p>

        </div>



        <div class="info-panels-row">

          <div class="panel info-panel">

            <h2>User Information</h2>

            <div id="user-details" class="details-grid"></div>

          </div>



          <div class="panel info-panel">

            <h2>Charger Information</h2>

            <div id="charger-details" class="details-grid"></div>

          </div>

        </div>



        <div class="panel issue-details-panel">

          <h2>Issue Details</h2>

          <div id="issue-details" class="details-grid"></div>

        </div>

      </section>

      <section class="detail-right wa-chat" id="wa-chat">

        <header class="wa-header">

          <div class="wa-avatar" id="wa-avatar" aria-hidden="true">?</div>

          <div class="wa-contact">

            <div class="wa-contact-name" id="wa-contact-name">Customer</div>

            <div class="wa-contact-sub" id="wa-contact-sub">Loading...</div>

          </div>

        </header>

        <div class="wa-messages" id="chat-messages">

          <p class="wa-loading">Loading conversation...</p>

        </div>

        <footer class="wa-compose">

          <div class="wa-input-wrap">

            <textarea id="chat-input" rows="1" placeholder="Type a message" aria-label="Message"></textarea>

          </div>

          <button type="button" id="chat-send-btn" class="wa-send-btn" aria-label="Send message">

            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">

              <path d="M1.101 21.757 23.8 12.028 1.101 2.3l.011 7.912 13.623 1.816-13.623 1.817-.011 7.912z" />

            </svg>

          </button>

        </footer>

      </section>

    </main>

  </div>



  <script src="/admin/app.js"></script>

  <script>

    AdminApp.initDetailPage();

  </script>

</body>

</html>
